name: Verify
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read build metadata
        id: metadata
        run: python3 scripts/release.py validate
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.metadata.outputs.go_version }}
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run test:unit && npm run build
        working-directory: frontend
      - run: go test -race ./... && go vet ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: npx playwright install --with-deps chromium && npx playwright test
        working-directory: frontend
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: mkdir -p /tmp/opencode && go build -race -o /tmp/opencode/multicaster ./cmd/multicaster
      - run: python3 scripts/smoke.py /tmp/opencode/multicaster
