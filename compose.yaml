services:
  multicaster:
    build: .
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8080:8080"
    volumes:
      - multicaster-data:/app/data
    healthcheck:
      test: ["CMD", "/app/multicaster", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  multicaster-data:
